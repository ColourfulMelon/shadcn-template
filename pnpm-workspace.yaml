# pnpm reads project settings from here (pnpm >= 10.16), not the package.json "pnpm" field.
# Approve sharp's native install/build script for Next.js image optimization. Without
# approval, pnpm 11 fails installs with ERR_PNPM_IGNORED_BUILDS. pnpm 11 uses `allowBuilds`;
# pnpm 10 (CI) uses `onlyBuiltDependencies`, so both are declared for cross-version
# compatibility.
# Delay newly published packages for seven days (the value is in minutes).
minimumReleaseAge: 0
allowBuilds:
  sharp: true
onlyBuiltDependencies:
  - sharp
minimumReleaseAgeExclude:
  # Renovate security update: next@16.2.11
  - next@16.2.11
  - '@next/env@16.2.11'
  - '@next/swc-darwin-arm64@16.2.11'
  - '@next/swc-darwin-x64@16.2.11'
  - '@next/swc-linux-arm64-gnu@16.2.11'
  - '@next/swc-linux-arm64-musl@16.2.11'
  - '@next/swc-linux-x64-gnu@16.2.11'
  - '@next/swc-linux-x64-musl@16.2.11'
  - '@next/swc-win32-arm64-msvc@16.2.11'
  - '@next/swc-win32-x64-msvc@16.2.11'
  - postcss@8.5.10 || 8.5.12 || 8.5.18
  - svgo@3.3.3 || 3.3.4
  - '@babel/plugin-transform-modules-systemjs@7.29.4'
  - js-yaml@4.1.2 || 4.3.0
  - '@babel/core@7.29.1'
  - sharp@0.35.0
overrides:
  postcss@<8.5.10: ^8.5.10
  postcss@<=8.5.11: ^8.5.12
  postcss@<=8.5.17: ^8.5.18
  sharp@<0.35.0: ^0.35.0
